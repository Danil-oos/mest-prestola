<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — Месть Престола</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/favicon.png" type="image/png">
<style>
  @font-face{font-family:'Ruslan Display';src:url('assets/fonts/RuslanDisplay-Regular.ttf') format('truetype');font-display:swap}
  @font-face{font-family:'Forum';src:url('assets/fonts/Forum-Regular.ttf') format('truetype');font-display:swap}
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(900px 600px at 50% 30%, #1a1512, #0d0b0a 70%);
    color:#eae2d5;font-family:'Forum',Georgia,serif;text-align:center;padding:24px;
  }
  .box{max-width:640px}
  .code{font-family:'Ruslan Display',serif;font-size:clamp(72px,18vw,140px);color:#c9a24b;line-height:1;margin:0}
  h1{font-family:'Ruslan Display',serif;font-size:clamp(24px,5vw,40px);font-weight:400;margin:.3em 0 .4em}
  p{color:#a89a84;margin:0 0 2em}
  a.btn{
    display:inline-block;padding:14px 32px;border-radius:10px;text-decoration:none;
    background:linear-gradient(180deg,#e7c976,#c9a24b);color:#1a1206;font-weight:600;
    box-shadow:0 10px 30px -12px rgba(201,162,75,.7);
  }
  a.btn:hover{filter:brightness(1.08)}
</style>
</head>
<body>
  <div class="box">
    <p class="code">404</p>
    <h1>Страница не найдена</h1>
    <p>Похоже, этой страницы нет. Но престол ждёт — возвращайся на главную.</p>
    <a class="btn" href="/">На главную</a>
  </div>
</body>
</html>
